<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Y-akuza</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #09090b;
      --surface:     #18181b;
      --surface-hi:  #1f1f23;
      --surface-act: #27272a;
      --border:      rgba(255,255,255,0.07);
      --border-hi:   rgba(255,255,255,0.13);
      --accent:      #3b82f6;
      --accent-dim:  rgba(59,130,246,0.14);
      --accent-ring: rgba(59,130,246,0.28);
      --tx:          #fafafa;
      --tx-2:        #a1a1aa;
      --tx-3:        #52525b;
      --r:           12px;
      --r-sm:        8px;
      --r-xs:        6px;
    }

    html, body { width: 310px; background: var(--bg); }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--tx);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 5px;
      gap: 8px;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--tx);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 20px; height: 20px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    .logo-text em { color: var(--tx-2); font-style: normal; font-weight: 500; }

    /* ── TABS ───────────────────────────────────────────────────── */

    .tabs {
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
      flex-shrink: 0;
    }

    .tab-btn {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--tx-3);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .tab-btn:hover  { color: var(--tx-2); }
    .tab-btn.active { background: var(--accent); color: #fff; }

    /* ── PANELS ─────────────────────────────────────────────────── */

    .panel { display: none; flex-direction: column; gap: 6px; }
    .panel.active { display: flex; }

    /* ── CARD ───────────────────────────────────────────────────── */

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }

    .card-label {
      padding: 7px 12px 5px;
      font-size: 9px;
      font-weight: 600;
      color: var(--tx-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    /* ── SCRUBBER ROWS ──────────────────────────────────────────── */

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
    }

    .scrubber-row + .scrubber-row { border-top: 1px solid var(--border); }

    .ctrl-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--tx-2);
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 42px;
    }

    .readout {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      min-width: 34px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ↑ Taller scrubber: 24px container, 4px track, 15px thumb */
    .scrubber {
      flex: 1;
      position: relative;
      height: 24px;
      display: flex;
      align-items: center;
    }

    .s-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: var(--surface-act);
      border-radius: 99px;
    }

    .s-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      pointer-events: none;
      will-change: width;
      transition: width 0.04s linear;
    }

    input[type=range].s-input {
      -webkit-appearance: none;
      appearance: none;
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      background: transparent;
      cursor: pointer;
      z-index: 2;
      outline: none;
    }

    input[type=range].s-input::-webkit-slider-runnable-track { background: none; height: 4px; }
    input[type=range].s-input::-moz-range-track { background: none; height: 4px; }

    input[type=range].s-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px; height: 15px;
      border-radius: 50%;
      background: #fff; border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.55), 0 0 0 2.5px var(--accent-ring);
      transition: box-shadow 0.15s, transform 0.15s;
    }

    input[type=range].s-input:active::-webkit-slider-thumb {
      transform: scale(1.18);
      box-shadow: 0 2px 8px rgba(0,0,0,0.65), 0 0 0 3.5px var(--accent-ring);
    }

    input[type=range].s-input::-moz-range-thumb {
      width: 15px; height: 15px;
      border-radius: 50%; background: #fff; border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* ── QUALITY PILLS (all 5 in one row) ───────────────────────── */

    .quality-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
    }

    .q-pill {
      flex: 1;
      font-size: 9.5px;
      font-weight: 600;
      font-family: ui-monospace, 'SF Mono', monospace;
      text-align: center;
      padding: 5px 2px;
      border-radius: var(--r-xs);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--tx-3);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.1s, background 0.1s, border-color 0.1s;
      user-select: none;
    }

    .q-pill:hover  { color: var(--tx-2); background: var(--surface-hi); border-color: var(--border-hi); }
    .q-pill.active { color: var(--accent); background: var(--accent-dim); border-color: var(--accent-ring); }

    /* Audio pill: icon-only, inline with resolution pills */
    .q-pill.q-audio {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 0;
    }

    .q-pill.q-audio.active {
      color: #a78bfa;
      background: rgba(167,139,250,0.12);
      border-color: rgba(167,139,250,0.35);
    }

    /* ── INTERFACE ELEMENTS: icon buttons BELOW the card-label ──── */

    .if-icons {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 10px 10px 12px;
    }

    /* Circular toggle — active (lit) = element IS hidden */
    .if-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--tx-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background   0.14s ease,
        border-color 0.14s ease,
        color        0.14s ease,
        box-shadow   0.14s ease;
      flex-shrink: 0;
      padding: 0;
      outline: none;
    }

    .if-btn:hover {
      border-color: var(--border-hi);
      color: var(--tx-2);
      background: var(--surface-hi);
    }

    .if-btn.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 0 2px var(--accent-ring);
    }

    .if-btn:active { transform: scale(0.88); }

    /* ── GRID SELECTOR ──────────────────────────────────────────── */

    .grid-selector {
      display: flex;
      gap: 5px;
      padding: 8px 12px;
    }

    .grid-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 9px 4px 8px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      user-select: none;
    }

    .grid-btn:hover  { background: var(--surface-hi); border-color: var(--border-hi); }
    .grid-btn.active { background: var(--accent-dim); border-color: var(--accent-ring); }

    .grid-icon { display: grid; gap: 2px; }
    .grid-icon.g3 { grid-template-columns: repeat(3, 8px); }
    .grid-icon.g4 { grid-template-columns: repeat(4, 6px); }

    .grid-icon span {
      height: 5px;
      border-radius: 2px;
      background: var(--tx-3);
      transition: background 0.12s;
    }

    .grid-btn.active .grid-icon span { background: var(--accent); }

    .grid-btn-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--tx-3);
      transition: color 0.12s;
    }

    .grid-btn.active .grid-btn-label { color: var(--accent); }

    /* ── TOOLTIP (anchored above element) ───────────────────────── */

    #tooltip {
      display: none;
      position: fixed;
      z-index: 9999;
      padding: 4px 8px;
      background: rgba(9,9,11,0.97);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-hi);
      border-radius: var(--r-xs);
      font-size: 10px;
      font-weight: 500;
      color: var(--tx);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0,0,0,0.55);
      animation: tip-in 0.1s ease forwards;
    }

    @keyframes tip-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────── -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">Y</div>
      <span class="logo-text">Y<em>-akuza</em></span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="player">Player</button>
      <button class="tab-btn"        data-tab="interface">Interface</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  PLAYER PANEL                                              -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div class="panel active" id="panel-player">

    <!-- Speed + Volume -->
    <div class="card">
      <div class="card-label">Playback</div>

      <div class="scrubber-row">
        <span class="ctrl-label">Speed</span>
        <div class="scrubber">
          <div class="s-track"><div class="s-fill" id="speedFill"></div></div>
          <input type="range" class="s-input" id="speedSlider"
                 min="0.25" max="4" step="0.25" value="1"/>
        </div>
        <span class="readout" id="speedVal">1×</span>
      </div>

      <div class="scrubber-row"
           data-tip="Amplifies volume beyond 100% using Web Audio API gain node.">
        <span class="ctrl-label">Volume</span>
        <div class="scrubber">
          <div class="s-track"><div class="s-fill" id="volumeFill"></div></div>
          <input type="range" class="s-input" id="volumeSlider"
                 min="100" max="300" step="10" value="100"/>
        </div>
        <span class="readout" id="volumeVal">1×</span>
      </div>
    </div>

    <!-- Quality — all 5 pills inline; Audio Only sits next to 720p -->
    <div class="card">
      <div class="card-label">Quality</div>
      <div class="quality-row">
        <div class="q-pill" data-q="hd2160">4K</div>
        <div class="q-pill" data-q="hd1440">1440p</div>
        <div class="q-pill" data-q="hd1080">1080p</div>
        <div class="q-pill" data-q="hd720">720p</div>
        <div class="q-pill q-audio" data-q="audio"
             data-tip="Forces lowest-quality stream + hides video — audio only.">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
      </div>
    </div>

  </div><!-- /panel-player -->

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  INTERFACE PANEL                                           -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <div class="panel" id="panel-interface">

    <!--
      Interface element toggles.
      Icons sit BELOW the card-label, spread evenly across the full width.
      Active (accent-lit) = the element IS being hidden on YouTube.
    -->
    <div class="card">
      <div class="card-label">Interface Elements</div>
      <div class="if-icons">

        <!-- Comments -->
        <button class="if-btn active" data-key="hideComments"
                data-tip="Hide comment section">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </button>

        <!-- Sidebar -->
        <button class="if-btn active" data-key="hideSidebar"
                data-tip="Hide recommendations sidebar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M15 3v18"/>
          </svg>
        </button>

        <!-- Info Bar / Meta -->
        <button class="if-btn active" data-key="hideMeta"
                data-tip="Hide title, channel &amp; action buttons">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4M12 8h.01"/>
          </svg>
        </button>

        <!-- End Cards -->
        <button class="if-btn active" data-key="hideEndCards"
                data-tip="Hide end cards &amp; overlay teasers">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/>
            <path d="m6.08 9.5-3.5 1.6a1 1 0 0 0 0 1.81l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9a1 1 0 0 0 0-1.83l-3.5-1.59"/>
          </svg>
        </button>

        <!-- Live Chat -->
        <button class="if-btn active" data-key="hideLiveChat"
                data-tip="Hide live stream chat frame">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4c0-1.1.9-2 2-2h8a2 2 0 0 1 2 2v5z"/>
            <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>
          </svg>
        </button>

        <!-- Navigation Rail -->
        <button class="if-btn active" data-key="hideNav"
                data-tip="Hide left navigation rail">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M9 3v18"/>
          </svg>
        </button>

        <!-- Shorts -->
        <button class="if-btn active" data-key="hideShorts"
                data-tip="Hide Shorts shelf &amp; redirect /shorts/ URLs">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h9l-1 8 10-12h-9z"/>
          </svg>
        </button>

      </div>
    </div>

    <!-- Grid Layout -->
    <div class="card">
      <div class="card-label">Grid Layout</div>
      <div class="grid-selector">

        <div class="grid-btn active" data-grid="4">
          <div class="grid-icon g4">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <span class="grid-btn-label">4 columns</span>
        </div>

        <div class="grid-btn" data-grid="3">
          <div class="grid-icon g3">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <span class="grid-btn-label">3 columns</span>
        </div>

      </div>
    </div>

  </div><!-- /panel-interface -->

  <div id="tooltip"></div>
  <script src="popup.js"></script>
</body>
</html>
